name: OS Portfolio CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: clean install
        run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Upload artifact (detailed report)
        uses: actions/upload-artifact@v4
        with:
          name: next-report
          path: next-artifacts/
